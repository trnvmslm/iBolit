name: ibolit

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ibolit
      POSTGRES_PASSWORD: ibolit
      POSTGRES_DB: ibolit
    ports: ["5433:5432"]  # 5433 on the host: a local Postgres often already uses 5432
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibolit"]
      interval: 3s
      retries: 20

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ibolit:ibolit@db:5432/ibolit
      MEDIA_ROOT: /app/media
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  media:
